# Dependency-policy checks for `cargo deny check`.

[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained-only notice for paste, pulled transitively by rav1e/ravif; the advisory has no safe upgrade and does not report a vulnerability." },
    { id = "RUSTSEC-2025-0141", reason = "Unmaintained-only notice for bincode, pulled transitively by optional Burn backends; the advisory has no safe upgrade and does not report a vulnerability." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
