[package]
name = "imq"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Sans-I/O image and video quality evaluation toolkit with CLI/TUI, ffmpeg pipes, Burn NN metrics, and wgpu kernels."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Sanzentyo/imq"
homepage = "https://github.com/Sanzentyo/imq"
keywords = ["image", "quality", "psnr", "ssim", "ffmpeg"]
categories = ["multimedia::images", "multimedia::video", "command-line-utilities"]

[workspace]
members = [".", "crates/imqraw-capi", "crates/imqraw-wasm"]

[lib]
name = "imq"
path = "src/lib.rs"

[[bin]]
name = "imq"
path = "src/bin/imq.rs"
required-features = ["cli"]

[[bin]]
name = "imq-quality"
path = "src/bin/imq-quality.rs"
required-features = ["cli"]

[features]
default = ["std", "serde", "image-codecs", "cli", "tui", "preview"]
std = []
serde = ["dep:serde", "dep:serde_json"]
image-codecs = ["dep:image"]
imqraw-image = ["image-codecs"]
cli = ["std", "serde", "image-codecs", "ffmpeg", "dep:anyhow", "dep:clap", "dep:csv", "dep:rusqlite", "dep:serde_yaml_ng", "dep:toml", "dep:tracing", "dep:tracing-subscriber"]
tui = ["cli", "preview", "dep:ratatui", "dep:crossterm", "dep:ratatui-image"]
ffmpeg = ["std", "serde"]
preview = ["std", "image-codecs", "ffmpeg", "dep:base64", "dep:fast_image_resize"]
cpu-only = []
gpu = ["std", "dep:wgpu", "dep:pollster", "dep:bytemuck"]
nn-burn = ["std", "dep:burn"]
nn-burn-wgpu = ["nn-burn", "burn?/wgpu", "burn?/fusion", "burn?/std"]
nn-burn-ndarray = ["nn-burn", "burn?/ndarray", "burn?/std"]

[dependencies]
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
image = { version = "0.25.10", optional = true }
base64 = { version = "0.22.1", optional = true }
anyhow = { version = "1.0.103", optional = true }
clap = { version = "4.6.1", features = ["derive", "wrap_help"], optional = true }
csv = { version = "1.4.0", optional = true }
rusqlite = { version = "0.40.0", features = ["bundled"], optional = true }
serde_yaml_ng = { version = "0.10.0", optional = true }
toml = { version = "1.1.2", optional = true }
ratatui = { version = "0.30.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm"], optional = true }
fast_image_resize = { version = "6.0.0", features = ["image"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
wgpu = { version = "29.0.3", features = ["wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
burn = { version = "0.21.0", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
approx = "0.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "sans_io"
path = "examples/sans_io.rs"

[[example]]
name = "imqraw_bundle"
path = "examples/imqraw_bundle.rs"

[[example]]
name = "compare_image"
path = "examples/compare_image.rs"
required-features = ["image-codecs"]

[[example]]
name = "video_compare"
path = "examples/video_compare.rs"
required-features = ["ffmpeg"]

[[example]]
name = "gpu_mse"
path = "examples/gpu_mse.rs"
required-features = ["gpu", "image-codecs"]

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
